name: Compilar APK Tablero Report

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tablero-report-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Crear Release Automática
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.2.11-b${{ github.run_number }}
          name: "Tablero Report v1.2.11 (Build ${{ github.run_number }})"
          body: |
            ### 🚀 Tablero Report v1.2.11
            - **Caché Persistente y Offline del Mapa:** Cada tesela satelital que se descarga se almacena localmente en memoria flash (hasta 20,000 bloques por 6 meses). No vuelve a descargarse nunca y funciona 100% sin conexión en campo.
            - **Edición Fluida de Puntos sin Solapamiento:** Se eliminó el error que relanzaba la ventana de configuración y recentraba el mapa cada vez que se cambiaba de color, ícono o nota. Ahora los cambios se reflejan al instante en tiempo real sobre el mapa sin saltos de cámara.
            - **Google Satelital Híbrido HD:** Zoom profundo continuo con nombres de vías e instalaciones.
            - **Íconos y Colores Inteligentes:** Visualización optimizada de Salas Eléctricas, Containers, Bombas, Refugios y Tableros.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
