name: Compilar APK Tablero Report

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tablero-report-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Crear Release Automática
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.2.10-b${{ github.run_number }}
          name: "Tablero Report v1.2.10 (Build ${{ github.run_number }})"
          body: |
            ### 🚀 Tablero Report v1.2.10
            - **Acceso Directo al Mapa:** Botón "Ver en mapa / Ubicar" directamente en cada tarjeta de la lista principal.
            - **Satélite Google HD:** Zoom profundo nítido sin errores de "map data not yet available".
            - **Íconos Personalizados:** Salas Eléctricas 🚪, Containers 📦, Bombas/Motores ⚙️, Subestaciones 🔌, Refugios 🛡️ y Tableros ⚡.
            - **Colores Automáticos:** Identificación visual inteligente por área de planta minera (Molienda, Flotación, Silos, Relaves, etc.).
            - **Exportar a WhatsApp:** Captura en alta resolución del plano para compartirlo.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
