name: Compilar APK Tablero Report

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tablero-report-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Crear Release Automática
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.2.0-${{ github.run_number }}
          name: "Tablero Report v1.2.0 (Build ${{ github.run_number }})"
          body: |
            ### 🚀 Nueva Versión de Tablero Report
            - **Mejora de GPS:** Cero coordenadas falsas en oficinas. Detección automática de salas blindadas / túneles.
            - **Catálogo de Tableros:** 218 tableros con búsqueda rápida multicriterio.
            - **Estampado:** Banner optimizado para UM Chinalco Toromocho.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
