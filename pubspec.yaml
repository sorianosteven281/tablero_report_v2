name: tablero_report
description: "App de Reportes de Mantenimiento de Tableros - UM Chinalco Toromocho"
publish_to: "none"
version: 1.2.10+13

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  image: ^4.3.0
  share_plus: ^10.1.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/photo_logo.png
    - assets/data/panels.json
