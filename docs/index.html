<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plano Satelital de Tableros | UM Chinalco Toromocho</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.94);
      --card-border: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); }

    #map { width: 100%; height: 100%; z-index: 1; }

    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      z-index: 1000; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }

    .header-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      flex-wrap: wrap; gap: 8px;
    }
    .brand-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 1.05rem; font-weight: 800; color: #fff;
    }
    .brand-title span { color: var(--accent); }
    .header-actions {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .stats-badge {
      font-size: 0.75rem; background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent); color: var(--accent);
      padding: 4px 8px; border-radius: 20px; font-weight: 700;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-action {
      display: flex; align-items: center; gap: 5px;
      background: #1e293b; color: #f8fafc; border: 1px solid var(--card-border);
      font-size: 0.75rem; font-weight: 700; padding: 6px 10px;
      border-radius: 8px; cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .btn-action:hover { background: #334155; transform: translateY(-1px); }
    .btn-action.btn-export { background: rgba(56, 189, 248, 0.2); border-color: var(--accent); color: var(--accent); }
    .btn-action.btn-export:hover { background: var(--accent); color: #0f172a; }
    .btn-action.btn-print { background: rgba(245, 158, 11, 0.2); border-color: var(--warning); color: var(--warning); }
    .btn-action.btn-print:hover { background: var(--warning); color: #0f172a; }
    .btn-action.btn-apk { background: #10b981; color: #042f2e; border: none; }
    .btn-action.btn-apk:hover { background: #34d399; }

    .controls-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      position: relative;
    }
    .search-row {
      display: flex; align-items: center; gap: 8px;
      background: #0f172a; border: 1px solid var(--card-border);
      border-radius: 10px; padding: 6px 12px;
    }
    .search-row input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #fff; font-size: 0.9rem;
    }
    .search-row input::placeholder { color: var(--text-muted); }
    .search-clear {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; display: none; padding: 2px;
    }

    .filter-chips {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap; font-size: 0.72rem; padding: 4px 10px;
      border-radius: 16px; background: #0f172a; border: 1px solid var(--card-border);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .chip.active {
      background: var(--accent); color: #0f172a; font-weight: 700;
      border-color: var(--accent);
    }
    .chip.chip-pending { border-color: rgba(239, 68, 68, 0.4); }
    .chip.chip-pending.active { background: var(--danger); color: #fff; border-color: var(--danger); }

    .search-dropdown {
      position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px;
      background: var(--panel-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); border-radius: 12px;
      max-height: 240px; overflow-y: auto; display: none; z-index: 1100;
      box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    }
    .search-item {
      padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      transition: background 0.15s;
    }
    .search-item:hover { background: rgba(56, 189, 248, 0.15); }
    .search-item-tag { font-weight: 700; color: #fff; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .search-item-loc { font-size: 0.72rem; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Modales */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px); z-index: 2000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card {
      background: #1e293b; border: 1px solid var(--card-border);
      border-radius: 16px; width: 100%; max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8); overflow: hidden;
      animation: modalIn 0.2s ease-out;
    }
    @keyframes modalIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      padding: 14px 18px; border-bottom: 1px solid var(--card-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-title { font-size: 1rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
    .btn-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; }
    .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
    .export-option-btn {
      display: flex; align-items: center; justify-content: space-between;
      background: #0f172a; border: 1px solid var(--card-border);
      padding: 12px 14px; border-radius: 12px; cursor: pointer;
      color: #fff; text-align: left; transition: all 0.2s;
    }
    .export-option-btn:hover {
      border-color: var(--accent); background: rgba(56, 189, 248, 0.1);
      transform: translateX(2px);
    }
    .export-opt-title { font-size: 0.88rem; font-weight: 700; }
    .export-opt-desc { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

    /* Lightbox de Foto Grande */
    .photo-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px); z-index: 2500;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; padding: 20px;
    }
    .photo-modal-img {
      max-width: 95%; max-height: 80vh; object-fit: contain;
      border-radius: 10px; border: 2px solid var(--accent);
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    }
    .photo-modal-caption {
      margin-top: 12px; font-weight: 800; font-size: 1.1rem; color: #fff;
      background: rgba(15, 23, 42, 0.8); padding: 6px 16px; border-radius: 20px;
    }

    /* Switcher & GPS */
    .layer-switcher {
      position: absolute; bottom: 24px; right: 12px; z-index: 1000;
      background: var(--panel-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); border-radius: 12px;
      padding: 6px; display: flex; flex-direction: column; gap: 4px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .layer-btn {
      background: transparent; border: none; padding: 6px 10px;
      color: var(--text-muted); font-size: 0.75rem; font-weight: 600;
      border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s;
    }
    .layer-btn.active {
      background: rgba(56, 189, 248, 0.2); color: var(--accent); font-weight: 700;
    }

    .btn-my-loc {
      position: absolute; bottom: 155px; right: 12px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--card-border);
      color: var(--accent); width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    .btn-my-loc:hover { background: #334155; transform: scale(1.05); }

    /* Marcadores personalizados */
    .custom-marker {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer;
    }
    .marker-badge {
      background: rgba(15, 23, 42, 0.94); border: 1.5px solid var(--marker-color);
      color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 6px; white-space: nowrap; box-shadow: 0 3px 6px rgba(0,0,0,0.7);
      margin-bottom: 2px; pointer-events: none;
    }
    .marker-pin {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--marker-color); border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8); color: #000; font-size: 13px;
    }

    /* Popups con Foto */
    .leaflet-popup-content-wrapper {
      background: #0f172a !important; color: #fff !important;
      border: 1px solid var(--accent); border-radius: 12px;
      padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    .leaflet-popup-tip { background: #0f172a !important; }
    .popup-box { padding: 8px 10px; min-width: 230px; max-width: 290px; }
    .popup-tag { font-size: 1.15rem; font-weight: 800; color: var(--accent); margin-bottom: 2px; }
    .popup-loc { font-size: 0.8rem; color: #e2e8f0; margin-bottom: 6px; line-height: 1.3; }
    
    .popup-photo-wrap {
      position: relative; width: 100%; height: 135px; border-radius: 8px;
      overflow: hidden; margin-bottom: 8px; border: 1px solid var(--card-border);
      background: #000; cursor: pointer;
    }
    .popup-photo-img {
      width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;
    }
    .popup-photo-wrap:hover .popup-photo-img { transform: scale(1.05); }
    .popup-photo-badge {
      position: absolute; bottom: 4px; right: 6px; background: rgba(0,0,0,0.7);
      color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px;
      display: flex; align-items: center; gap: 3px; font-weight: 600;
    }

    .popup-info { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
    .popup-note {
      background: #1e293b; border-left: 3px solid #f59e0b;
      padding: 6px 8px; font-size: 0.72rem; color: #fef08a; border-radius: 4px;
      margin: 6px 0;
    }
    .popup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .btn-pop {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 4px; font-size: 0.7rem; font-weight: 700;
      border-radius: 6px; text-decoration: none; border: none; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-pop:hover { opacity: 0.85; }
    .btn-pop-maps { background: var(--accent); color: #0b1120; grid-column: span 2; }
    .btn-pop-wa { background: #22c55e; color: #052e16; }
    .btn-pop-copy { background: #334155; color: #f8fafc; }

    /* Toast */
    .toast-msg {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #0284c7; color: #fff; padding: 8px 16px;
      border-radius: 20px; font-size: 0.8rem; font-weight: 700;
      z-index: 3000; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      display: none; animation: toastIn 0.2s ease-out;
    }
    @keyframes toastIn {
      from { transform: translate(-50%, 10px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    /* VISTA DE IMPRESIÓN INFORMAL (TIPO MAPS) */
    #print-container { display: none; }
    @media print {
      body, html { overflow: visible !important; height: auto !important; background: #fff !important; color: #000 !important; }
      .top-bar, .layer-switcher, .btn-my-loc, .modal-overlay, .photo-modal-overlay, .toast-msg { display: none !important; }
      #map { height: 420px !important; width: 100% !important; margin-bottom: 15px !important; border: 1px solid #ccc !important; }
      #print-container {
        display: block !important; padding: 15px; font-size: 11pt; color: #111;
      }
      .print-header { border-bottom: 2px solid #0284c7; padding-bottom: 8px; margin-bottom: 12px; }
      .print-header h1 { font-size: 16pt; margin: 0 0 4px 0; color: #0f172a; }
      .print-meta { font-size: 9pt; color: #475569; display: flex; justify-content: space-between; }
      .print-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px; page-break-inside: auto;
      }
      .print-card {
        border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px;
        page-break-inside: avoid; display: flex; gap: 8px; background: #f8fafc;
      }
      .print-card-img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; flex-shrink: 0; }
      .print-card-body { flex: 1; }
      .print-card-tag { font-size: 11pt; font-weight: bold; color: #0369a1; margin-bottom: 2px; }
      .print-card-loc { font-size: 8.5pt; color: #334155; margin-bottom: 3px; }
      .print-card-gps { font-size: 7.5pt; font-family: monospace; color: #64748b; }
      .print-card-note { font-size: 8pt; background: #fef3c7; padding: 3px 6px; border-radius: 4px; margin-top: 4px; border-left: 2px solid #d97706; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="header-card">
      <div class="brand-title">
        <i data-lucide="map-pin" color="#38bdf8" size="20"></i>
        <div>Plano <span>Chinalco Toromocho</span></div>
      </div>
      <div class="header-actions">
        <div class="stats-badge" id="stats-badge">
          <i data-lucide="check-circle-2" size="13"></i>
          <span>161 / 224 Ubicados</span>
        </div>
        <button class="btn-action btn-print" onclick="printInformalMap()" title="Imprimir plano de campo tipo Google Maps">
          <i data-lucide="printer" size="14"></i> Imprimir Plano
        </button>
        <button class="btn-action btn-export" id="btn-open-export">
          <i data-lucide="download" size="14"></i> Exportar
        </button>
        <a class="btn-action btn-apk" href="https://github.com/sorianosteven281/tablero_report_v2/releases/latest" target="_blank">
          <i data-lucide="smartphone" size="14"></i> APK
        </a>
      </div>
    </div>

    <div class="controls-card">
      <div class="search-row">
        <i data-lucide="search" size="16" color="#94a3b8"></i>
        <input type="text" id="search-input" placeholder="Buscar TAG, área o equipo (ej. 2110, GEHO, CP01, Sala)..." />
        <button class="search-clear" id="search-clear"><i data-lucide="x" size="14"></i></button>
      </div>
      <div class="search-dropdown" id="search-dropdown"></div>

      <div class="filter-chips" id="chips-container">
        <button class="chip active" data-zone="ALL">Todos Ubicados</button>
        <button class="chip chip-pending" data-zone="PENDING">⚠️ Pendientes (63)</button>
        <button class="chip" data-zone="2110">Molienda (2110)</button>
        <button class="chip" data-zone="2210">Flotación (2210/2214)</button>
        <button class="chip" data-zone="2212">Espesadores (2212/2215)</button>
        <button class="chip" data-zone="245">Filtros Prensa (245)</button>
        <button class="chip" data-zone="255">Relaves/GEHO (255/256)</button>
        <button class="chip" data-zone="2615">Cal/Reactivos (2615)</button>
        <button class="chip" data-zone="400">Silos Cal (400)</button>
        <button class="chip" data-zone="200">Fajas / Overland (200)</button>
      </div>
    </div>
  </div>

  <button class="btn-my-loc" id="btn-my-loc" title="Mi Ubicación GPS">
    <i data-lucide="crosshair" size="20"></i>
  </button>

  <div class="layer-switcher">
    <button class="layer-btn active" data-layer="google_hybrid">Google Híbrido HD</button>
    <button class="layer-btn" data-layer="google_sat">Google Satélite</button>
    <button class="layer-btn" data-layer="esri">Esri ArcGIS</button>
    <button class="layer-btn" data-layer="osm">OpenStreetMap</button>
  </div>

  <!-- Modal de Exportación -->
  <div class="modal-overlay" id="export-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <i data-lucide="share-2" size="18" color="#38bdf8"></i>
          Exportar Puntos de Mapeo
        </div>
        <button class="btn-close" id="btn-close-export"><i data-lucide="x" size="18"></i></button>
      </div>
      <div class="modal-body">
        <button class="export-option-btn" onclick="printInformalMap()">
          <div>
            <div class="export-opt-title">🖨️ Ficha de Campo para Imprimir (Tipo Maps)</div>
            <div class="export-opt-desc">Vista rápida para imprimir en hoja A4 con mapa, fotos de tableros y notas.</div>
          </div>
          <i data-lucide="printer" size="18" color="#f59e0b"></i>
        </button>

        <button class="export-option-btn" onclick="exportData('kml')">
          <div>
            <div class="export-opt-title">🌍 Google Earth (KML)</div>
            <div class="export-opt-desc">Abre directo en Google Earth / AutoCAD con pines, colores y notas.</div>
          </div>
          <i data-lucide="chevron-right" size="18" color="#94a3b8"></i>
        </button>

        <button class="export-option-btn" onclick="exportData('csv')">
          <div>
            <div class="export-opt-title">📊 Excel / Hoja de Cálculo (CSV)</div>
            <div class="export-opt-desc">Tabla con TAG, Área, Tipo, Coordenadas GPS y Notas de acceso.</div>
          </div>
          <i data-lucide="chevron-right" size="18" color="#94a3b8"></i>
        </button>

        <button class="export-option-btn" onclick="exportData('geojson')">
          <div>
            <div class="export-opt-title">🗺️ GeoJSON (SIG / QGIS)</div>
            <div class="export-opt-desc">Capa geoespacial estándar para sistemas GIS de la mina.</div>
          </div>
          <i data-lucide="chevron-right" size="18" color="#94a3b8"></i>
        </button>

        <button class="export-option-btn" onclick="exportData('json')">
          <div>
            <div class="export-opt-title">💾 Respaldo Móvil (JSON)</div>
            <div class="export-opt-desc">Formato nativo para importar/sincronizar con la App Android.</div>
          </div>
          <i data-lucide="chevron-right" size="18" color="#94a3b8"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Lightbox de Foto Ampliada -->
  <div class="photo-modal-overlay" id="photo-modal" onclick="closePhotoModal()">
    <img class="photo-modal-img" id="photo-modal-img" src="" />
    <div class="photo-modal-caption" id="photo-modal-caption"></div>
  </div>

  <!-- Contenedor Exclusivo de Impresión Informal -->
  <div id="print-container"></div>

  <div id="toast" class="toast-msg">Coordenadas copiadas</div>

  <div id="map"></div>

  <!-- Carga de datos y lógica de mapa -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
