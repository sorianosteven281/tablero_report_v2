<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plano Satelital de Tableros | UM Chinalco Toromocho</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.94);
      --card-border: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); }

    #map { width: 100%; height: 100%; z-index: 1; }

    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      z-index: 1000; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }

    .header-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .brand-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 1.05rem; font-weight: 800; color: #fff;
    }
    .brand-title span { color: var(--accent); }
    .stats-badge {
      font-size: 0.75rem; background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent); color: var(--accent);
      padding: 3px 8px; border-radius: 20px; font-weight: 700;
    }
    .btn-apk {
      display: flex; align-items: center; gap: 6px;
      background: #10b981; color: #042f2e; text-decoration: none;
      font-size: 0.75rem; font-weight: 800; padding: 6px 12px;
      border-radius: 8px; transition: all 0.2s;
    }
    .btn-apk:hover { background: #34d399; transform: scale(1.02); }

    .controls-card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .search-row {
      display: flex; align-items: center; gap: 8px;
      background: #0f172a; border: 1px solid var(--card-border);
      border-radius: 10px; padding: 6px 12px;
    }
    .search-row input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #fff; font-size: 0.9rem;
    }
    .search-row input::placeholder { color: var(--text-muted); }

    .filter-chips {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap; font-size: 0.72rem; padding: 4px 10px;
      border-radius: 16px; background: #0f172a; border: 1px solid var(--card-border);
      color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .chip.active {
      background: var(--accent); color: #0f172a; font-weight: 700;
      border-color: var(--accent);
    }

    .layer-switcher {
      position: absolute; bottom: 24px; right: 12px; z-index: 1000;
      background: var(--panel-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); border-radius: 12px;
      padding: 6px; display: flex; flex-direction: column; gap: 4px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .layer-btn {
      background: transparent; border: none; padding: 6px 10px;
      color: var(--text-muted); font-size: 0.75rem; font-weight: 600;
      border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.2s;
    }
    .layer-btn.active {
      background: rgba(56, 189, 248, 0.2); color: var(--accent); font-weight: 700;
    }

    .btn-my-loc {
      position: absolute; bottom: 155px; right: 12px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--card-border);
      color: var(--accent); width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    .custom-marker {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer;
    }
    .marker-badge {
      background: rgba(15, 23, 42, 0.94); border: 1.5px solid var(--marker-color);
      color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 6px; white-space: nowrap; box-shadow: 0 3px 6px rgba(0,0,0,0.7);
      margin-bottom: 2px; pointer-events: none;
    }
    .marker-pin {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--marker-color); border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8); color: #000; font-size: 13px;
    }

    .leaflet-popup-content-wrapper {
      background: #0f172a !important; color: #fff !important;
      border: 1px solid var(--accent); border-radius: 12px;
      padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    .leaflet-popup-tip { background: #0f172a !important; }
    .popup-box { padding: 8px 10px; min-width: 200px; max-width: 260px; }
    .popup-tag { font-size: 1.1rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .popup-loc { font-size: 0.8rem; color: #e2e8f0; margin-bottom: 6px; line-height: 1.3; }
    .popup-info { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
    .popup-note {
      background: #1e293b; border-left: 3px solid #f59e0b;
      padding: 6px 8px; font-size: 0.72rem; color: #fef08a; border-radius: 4px;
      margin: 6px 0;
    }
    .btn-maps {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      width: 100%; padding: 6px 0; background: var(--accent); color: #0b1120;
      text-decoration: none; font-size: 0.75rem; font-weight: 700;
      border-radius: 6px; margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="header-card">
      <div class="brand-title">
        <i data-lucide="map-pin" color="#38bdf8" size="20"></i>
        <div>Plano <span>Chinalco Toromocho</span></div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="stats-badge" id="stats-badge">123 Ubicados</span>
        <a class="btn-apk" href="https://github.com/sorianosteven281/tablero_report_v2/releases/latest" target="_blank">
          <i data-lucide="download" size="14"></i> APK App
        </a>
      </div>
    </div>

    <div class="controls-card">
      <div class="search-row">
        <i data-lucide="search" size="16" color="#94a3b8"></i>
        <input type="text" id="search-input" placeholder="Buscar por TAG, área o equipo (ej. 2210, GEHO, CP01, Sala)..." />
      </div>
      <div class="filter-chips" id="chips-container">
        <button class="chip active" data-zone="ALL">Todos</button>
        <button class="chip" data-zone="2110">Molienda (2110)</button>
        <button class="chip" data-zone="2210">Flotación (2210/2214)</button>
        <button class="chip" data-zone="2212">Espesadores (2212/2215)</button>
        <button class="chip" data-zone="245">Filtros Prensa (245)</button>
        <button class="chip" data-zone="255">Relaves/GEHO (255/256)</button>
        <button class="chip" data-zone="400">Silos de Cal (400)</button>
        <button class="chip" data-zone="200">Fajas / Overland (200)</button>
      </div>
    </div>
  </div>

  <button class="btn-my-loc" id="btn-my-loc" title="Mi Ubicación GPS">
    <i data-lucide="crosshair" size="20"></i>
  </button>

  <div class="layer-switcher">
    <button class="layer-btn active" data-layer="google_hybrid">Google Híbrido HD</button>
    <button class="layer-btn" data-layer="google_sat">Google Satélite</button>
    <button class="layer-btn" data-layer="esri">Esri ArcGIS</button>
    <button class="layer-btn" data-layer="osm">OpenStreetMap</button>
  </div>

  <div id="map"></div>

    const map = L.map('map', {
      center: [-11.6685, -76.1455],
      zoom: 16.5,
      maxZoom: 21,
      zoomControl: false
    });
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    const layers = {
      google_hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 21, maxNativeZoom: 19 }),
      google_sat: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 21, maxNativeZoom: 19 }),
      esri: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 17 }),
      osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };
    layers.google_hybrid.addTo(map);

    document.querySelectorAll('.layer-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const layerKey = e.target.getAttribute('data-layer');
        Object.values(layers).forEach(l => map.removeLayer(l));
        layers[layerKey].addTo(map);
      });
    });

    function resolveColor(p) {
      if (p.color && p.color.length > 0) return p.color;
      const t = p.tag.toUpperCase();
      const l = p.loc.toUpperCase();
      if (t.startsWith('400') || l.includes('SILO')) return '#8B5CF6';
      if (t.startsWith('2615') || t.startsWith('2610') || l.includes('CAL')) return '#EAB308';
      if (t.startsWith('255') || t.startsWith('256') || l.includes('RELAVE') || l.includes('GEHO')) return '#EF4444';
      if (t.startsWith('245') || t.startsWith('240') || l.includes('FILTR')) return '#10B981';
      if (t.startsWith('2214') || t.startsWith('2210') || l.includes('FLOTAC')) return '#0284C7';
      if (t.startsWith('2212') || t.startsWith('2215') || l.includes('REMOLIENDA')) return '#06B6D4';
      if (t.startsWith('2115') || l.includes('PEBBLE')) return '#D97706';
      if (t.startsWith('2110') || l.includes('MOLIENDA')) return '#F59E0B';
      if (t.startsWith('200') || t.startsWith('210') || l.includes('FAJA')) return '#94A3B8';
      return '#38BDF8';
    }

    function resolveIconChar(p) {
      const iconKey = p.icon || '';
      if (iconKey === 'room') return '🚪';
      if (iconKey === 'container') return '📦';
      if (iconKey === 'pump') return '⚙️';
      if (iconKey === 'substation') return '🔌';
      if (iconKey === 'refugio') return '🛡️';
      if (iconKey === 'faja') return '🏗️';
      if (iconKey === 'taller') return '🔧';

      const l = p.loc.toUpperCase();
      const t = p.tag.toUpperCase();
      if (l.includes('CONTAINER') || l.includes('MODULO')) return '📦';
      if (l.includes('SALA') || l.includes('ER-')) return '🚪';
      if (l.includes('BOMBA') || l.includes('GEHO') || t.includes('PP')) return '⚙️';
      if (l.includes('SUBESTACION') || t.includes('US-')) return '🔌';
      if (t.includes('REFUGIO')) return '🛡️';
      return '⚡';
    }

    const markersLayer = L.layerGroup().addTo(map);
    let activeZone = 'ALL';
    let searchQuery = '';

    function renderMarkers() {
      markersLayer.clearLayers();
      let count = 0;
      const q = searchQuery.toLowerCase().replace(/[-_ ]/g, '');

      ALL_PANELS.forEach(p => {
        if (p.latitude === undefined || p.latitude === null || p.longitude === undefined || p.longitude === null) return;

        if (activeZone !== 'ALL') {
          const t = p.tag.toUpperCase();
          if (!t.startsWith(activeZone)) return;
        }

        if (q.length > 0) {
          const cleanTag = p.tag.toLowerCase().replace(/[-_ ]/g, '');
          const cleanLoc = p.loc.toLowerCase().replace(/[-_ ]/g, '');
          if (!cleanTag.includes(q) && !cleanLoc.includes(q)) return;
        }

        count++;
        const color = resolveColor(p);
        const iconChar = resolveIconChar(p);

        const customIcon = L.divIcon({
          className: '',
          html: `
            <div class="custom-marker" style="--marker-color: ${color};">
              <div class="marker-badge">${p.tag}</div>
              <div class="marker-pin">${iconChar}</div>
            </div>
          `,
          iconSize: [80, 50],
          iconAnchor: [40, 48]
        });

        const m = L.marker([p.latitude, p.longitude], { icon: customIcon });

        const gmapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + p.latitude + ',' + p.longitude;
        const noteHtml = p.note ? `<div class="popup-note">📌 <b>Nota:</b> ${p.note}</div>` : '';

        m.bindPopup(`
          <div class="popup-box">
            <div class="popup-tag">${p.tag}</div>
            <div class="popup-loc">${p.loc}</div>
            <div class="popup-info"><b>Tipo:</b> ${p.type}</div>
            <div class="popup-info"><b>GPS:</b> ${p.latitude.toFixed(6)}, ${p.longitude.toFixed(6)}</div>
            ${noteHtml}
            <a class="btn-maps" href="${gmapsUrl}" target="_blank">Abrir en Google Maps</a>
          </div>
        `);

        markersLayer.addLayer(m);
      });

      document.getElementById('stats-badge').innerText = `${count} Ubicados`;
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderMarkers();
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        activeZone = e.target.getAttribute('data-zone');
        renderMarkers();
      });
    });

    let myLocMarker = null;
    document.getElementById('btn-my-loc').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert('Geolocalización no soportada en este navegador.');
        return;
      }
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        map.setView([lat, lng], 18.5);
        if (myLocMarker) map.removeLayer(myLocMarker);
        myLocMarker = L.circleMarker([lat, lng], {
          radius: 8, fillColor: '#0284c7', color: '#fff', weight: 3, fillOpacity: 1
        }).addTo(map);
      }, (err) => {
        alert('No se pudo obtener la ubicación GPS: ' + err.message);
      }, { enableHighAccuracy: true });
    });

    renderMarkers();
    lucide.createIcons();
  </script>
